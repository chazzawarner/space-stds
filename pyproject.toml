[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "space-stds"
version = "0.1.0"
description = "A local-first MCP server for authorised CCSDS and ECSS standards"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2,<3",
  "pypdf>=6,<7",
]

[project.optional-dependencies]
pdf-inspector = [
  "pdf-inspector==1.14.2",
]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
space-stds = "space_stds.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/space_stds"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["space_stds"]
